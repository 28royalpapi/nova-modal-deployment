name: DEPRECATED - NOVA no longer deploys Modal

# Disabled on purpose: NOVA's public, read-only research path now runs through
# the Supabase Edge Function using a stateless page reader. This repository no
# longer deploys or depends on a Modal Linux/Chromium worker.
#
# Before any future hosted-browser implementation, create a fresh Modal token
# pair and perform a security review. Do not re-enable this workflow by default.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Modal deployment disabled
        run: |
          echo "Modal deployment has been retired for NOVA."
          echo "Read-only research uses NOVA's Supabase serverless public-reader path."
          exit 1
