name: Deploy NOVA Modal worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/modal-deploy.yml"
      - "nova_modal_corrected_source.txt"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Modal credentials are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.NOVA_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.NOVA_SECRET_KEY || secrets.NOVA_TOKEN_SECRET || secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add the Modal token pair as repository Actions secrets NOVA_TOKEN_ID and NOVA_SECRET_KEY (preferred), or MODAL_TOKEN_ID and MODAL_TOKEN_SECRET."
            exit 1
          fi

      - name: Validate and normalize Modal API credentials
        env:
          RAW_MODAL_TOKEN_ID: ${{ secrets.NOVA_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
          RAW_MODAL_TOKEN_SECRET: ${{ secrets.NOVA_SECRET_KEY || secrets.NOVA_TOKEN_SECRET || secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          known = ("ak-", "as-", "wk-", "ws-")

          def clean(name):
              value = "".join(os.environ.get(name, "").split()).strip(chr(34)).strip(chr(39))
              # Recover the credential itself if a copied label, BOM, or other wrapper
              # was accidentally included before the known token prefix.
              positions = [(value.find(prefix), prefix) for prefix in known if value.find(prefix) >= 0]
              if positions:
                  position, _ = min(positions, key=lambda pair: pair[0])
                  value = value[position:]
              return value

          token_id = clean("RAW_MODAL_TOKEN_ID")
          token_secret = clean("RAW_MODAL_TOKEN_SECRET")
          id_prefix = token_id[:3] if token_id[:3] in known else "other"
          secret_prefix = token_secret[:3] if token_secret[:3] in known else "other"
          print(f"Credential type check (prefixes only): ID={id_prefix}; secret={secret_prefix}")
          print(f"Credential lengths (values not shown): ID={len(token_id)}; secret={len(token_secret)}")

          if id_prefix == "as-" and secret_prefix == "ak-":
              token_id, token_secret = token_secret, token_id
              id_prefix, secret_prefix = "ak-", "as-"
              print("Detected reversed Modal API credential order; corrected in the runner only.")

          if id_prefix != "ak-" or secret_prefix != "as-":
              print("::error::No complete Modal API token pair was found in the selected secrets. Expected API prefixes ak- and as-. Workspace proxy prefixes wk-/ws- cannot deploy apps. No token values were printed.")
              sys.exit(1)

          env_file = pathlib.Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write("MODAL_TOKEN_ID=" + token_id + "\n")
              f.write("MODAL_TOKEN_SECRET=" + token_secret + "\n")
          print("Modal API credential format accepted. Token values were not printed.")
          PY

      - name: Prepare and syntax-check worker
        run: |
          cp nova_modal_corrected_source.txt nova_modal.py
          python -m py_compile nova_modal.py

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal httpx "fastapi[standard]"

      - name: Deploy NOVA worker to Modal
        run: modal deploy nova_modal.py
        
