name: Deploy NOVA Modal worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/modal-deploy.yml"
      - "nova_modal_corrected_source.txt"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Modal credentials are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add repository Actions secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET before deploying."
            exit 1
          fi

      - name: Validate and normalize Modal API credentials
        env:
          RAW_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          def clean(name):
              value = os.environ.get(name, "").strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in ("\\\"", "'"):
                  value = value[1:-1].strip()
              return value.replace("\\r", "").replace("\\n", "")

          token_id = clean("RAW_MODAL_TOKEN_ID")
          token_secret = clean("RAW_MODAL_TOKEN_SECRET")
          recognized = ("ak-", "as-", "wk-", "ws-")
          id_prefix = token_id[:3] if token_id[:3] in recognized else "other"
          secret_prefix = token_secret[:3] if token_secret[:3] in recognized else "other"
          print(f"Credential type check (prefixes only): ID={id_prefix}; secret={secret_prefix}")
          print(f"Credential lengths (values not shown): ID={len(token_id)}; secret={len(token_secret)}")

          if id_prefix == "as-" and secret_prefix == "ak-":
              token_id, token_secret = token_secret, token_id
              id_prefix, secret_prefix = "ak-", "as-"
              print("Detected reversed Modal API credential order; corrected in the runner only.")

          if id_prefix != "ak-" or secret_prefix != "as-":
              print("::error::Expected Modal API token ID ak-... and secret as-.... Workspace proxy credentials wk-/ws- cannot deploy apps. This diagnostic prints prefixes only, never token values.")
              sys.exit(1)

          env_file = pathlib.Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"MODAL_TOKEN_ID={token_id}\\n")
              f.write(f"MODAL_TOKEN_SECRET={token_secret}\\n")
          print("Modal API credential format accepted. Token values were not printed.")
          PY

      - name: Prepare and syntax-check worker
        run: |
          cp nova_modal_corrected_source.txt nova_modal.py
          python -m py_compile nova_modal.py

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal httpx "fastapi[standard]"

      - name: Deploy NOVA worker to Modal
        run: modal deploy nova_modal.py
        
