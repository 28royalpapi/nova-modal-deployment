name: Deploy NOVA Modal worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/modal-deploy.yml"
      - "nova_modal_corrected_source.txt"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Modal credentials are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add repository Actions secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET before deploying."
            exit 1
          fi

      - name: Validate and normalize Modal API credentials
        env:
          RAW_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [[ "$RAW_MODAL_TOKEN_ID" == ak-* && "$RAW_MODAL_TOKEN_SECRET" == as-* ]]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$RAW_MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$RAW_MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
            echo "Modal API credential types verified."
          elif [[ "$RAW_MODAL_TOKEN_ID" == as-* && "$RAW_MODAL_TOKEN_SECRET" == ak-* ]]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$RAW_MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$RAW_MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            echo "::warning::The two valid Modal API values were in opposite fields; the workflow corrected their order for this deployment."
          else
            echo "::error::The saved values are not a Modal API token pair. The API token ID must begin ak- and the secret as-. Workspace proxy credentials begin wk-/ws- and cannot deploy apps. Replace the saved values with an API token pair."
            exit 1
          fi

      - name: Prepare and syntax-check worker
        run: |
          cp nova_modal_corrected_source.txt nova_modal.py
          python -m py_compile nova_modal.py

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal httpx "fastapi[standard]"

      - name: Deploy NOVA worker to Modal
        run: modal deploy nova_modal.py
        
